# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, dev]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}${{ matrix.config.tools == 'none' && ', no tools' || '' }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # the optional tools are only available on linux at the moment
          - {os: macos-latest,   r: 'release',  py: "3.11",  tools: 'none' }
          - {os: windows-latest, r: 'release',  py: "3.11",  tools: 'none' }
          - {os: ubuntu-latest,   r: 'devel',  py: "3.11",  http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release',  py: "3.11" }
          - {os: ubuntu-latest,   r: 'oldrel-1',  py: "3.11" }
          # check that everything works without the optional tools (and
          # without conda)
          - {os: ubuntu-latest,   r: 'release',  py: "3.11",  tools: 'none' }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4
      
      # without the optional tools, conda is not installed, as on a machine
      # where tidygenclust is installed without them
      - uses: conda-incubator/setup-miniconda@v3
        if: matrix.config.tools != 'none'
        with:
          auto-update-conda: true
          python-version: ${{ matrix.config.py }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::devtools
          needs: check

      - name: install tools
        if: matrix.config.tools != 'none'
        run: |
          Rscript -e 'source("./R/tgc_tools_install.R"); tgc_tools_install(reset = TRUE, ci_install = TRUE)'

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
