# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, dev]
  pull_request:

name: test-coverage.yaml

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # one OpenMP thread unless the code asks for more: the counters of
      # --coverage are shared by all the threads, which slow each other down
      # (the radmix kernels set their threads with n_cores, default 1)
      OMP_NUM_THREADS: 1

    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Install external tools
        run: |
          source("./R/tgc_tools_install.R")
          tgc_tools_install(ci_install = TRUE, reset = TRUE)
        shell: Rscript {0}

      - name: Test coverage
        run: |
          # covr compiles at -O0, where the C++ kernels run many times slower
          # than in a release build (nothing is inlined): compile at -O1
          # instead, at the cost of a slightly less exact attribution of the
          # coverage to the lines of the C++ code
          loadNamespace("covr")
          flags <- sub("-O0", "-O1", getOption("covr.flags"), fixed = TRUE)
          # keep the bounds checks of libstdc++, which GCC >= 15 only turns
          # on by default at -O0: they catch out-of-bounds indices that the
          # release builds of R CMD check hide
          cxx <- startsWith(names(flags), "CXX")
          flags[cxx] <- paste(flags[cxx], "-D_GLIBCXX_ASSERTIONS")
          options(covr.flags = flags)
          print(getOption("covr.flags"))
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v5
        with:
          # Fail if error if not on PR, or if on PR and token is given
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
